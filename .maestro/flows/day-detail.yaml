appId: com.subcal.app
---
- launchApp:
    clearState: true

# Wait for calendar to load by checking for the "Today" button (always visible)
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000

# Tap on day 3 which should have Netflix
- tapOn:
    text: "3"
    index: 0

- extendedWaitUntil:
    visible: "Netflix"
    timeout: 5000
    optional: true

- takeScreenshot: 06-day-detail-modal

# Close modal
- tapOn: "Close"
