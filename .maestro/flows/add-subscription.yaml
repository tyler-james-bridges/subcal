appId: com.subcal.app
---
- launchApp:
    clearState: true

# Wait for calendar to load by checking for the "Today" button (always visible)
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000

# Tap the + button to add subscription
- tapOn: "Add subscription"

- extendedWaitUntil:
    visible: "Add Subscription"
    timeout: 5000

- takeScreenshot: 05-add-subscription-modal

# Close modal
- tapOn: "Close"
