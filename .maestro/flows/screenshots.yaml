appId: com.subcal.app
---
- launchApp:
    clearState: true

# Wait for calendar to load (reduced timeout - app loads fast)
- extendedWaitUntil:
    visible: "Today"
    timeout: 5000

# === HOME SCREEN ===
- takeScreenshot: screenshots/01-home-calendar

- tapOn: "Today"
- takeScreenshot: screenshots/02-today-highlighted

# Navigate to next month
- tapOn: "Next month"
- assertVisible: "Today"
- takeScreenshot: screenshots/03-next-month

# Navigate back two months
- tapOn: "Previous month"
- tapOn: "Previous month"
- assertVisible: "Today"
- takeScreenshot: screenshots/04-previous-month

# Return to current month
- tapOn: "Today"

# === ADD SUBSCRIPTION MODAL ===
- tapOn: "Add subscription"

- extendedWaitUntil:
    visible: "Add Subscription"
    timeout: 2000

- takeScreenshot: screenshots/05-add-subscription-modal

- tapOn: "Close"

# Wait for modal to close
- extendedWaitUntil:
    visible: "Today"
    timeout: 2000

# === DAY DETAIL MODAL ===
- tapOn:
    text: "3"
    index: 0

- extendedWaitUntil:
    visible: "Netflix"
    timeout: 2000
    optional: true

- takeScreenshot: screenshots/06-day-detail-modal

# Tap outside modal to dismiss (tap on overlay area at top of screen)
- tapOn:
    point: "50%,20%"
