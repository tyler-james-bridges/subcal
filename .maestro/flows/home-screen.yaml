appId: com.subcal.app
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "January"
    timeout: 10000

- takeScreenshot: 01-home-calendar

- tapOn: "Today"
- takeScreenshot: 02-today-highlighted

- tapOn: "Next month"
- extendedWaitUntil:
    visible: "February"
    timeout: 3000
- takeScreenshot: 03-next-month

- tapOn: "Previous month"
- tapOn: "Previous month"
- extendedWaitUntil:
    visible: "December"
    timeout: 3000
- takeScreenshot: 04-previous-month
