appId: com.subcal.app
---
- launchApp:
    clearState: true

# Wait for calendar to load by checking for the "Today" button (always visible)
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000

- takeScreenshot: 01-home-calendar

- tapOn: "Today"
- takeScreenshot: 02-today-highlighted

# Navigate to next month
- tapOn: "Next month"
- assertVisible: "Today"
- takeScreenshot: 03-next-month

# Navigate back two months
- tapOn: "Previous month"
- tapOn: "Previous month"
- assertVisible: "Today"
- takeScreenshot: 04-previous-month
