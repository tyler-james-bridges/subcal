name: Maestro Screenshot Tests

on:
  pull_request:
    branches: [main]

jobs:
  screenshot-tests:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Boot iOS Simulator (background)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15 Pro" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}')
          fi
          echo "Booting device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null &
          echo "SIMULATOR_UDID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and Maestro
        run: |
          npm ci &
          NPM_PID=$!
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          wait $NPM_PID

      # Cache the built .app based on native-only files
      # JS changes won't invalidate this cache - Metro serves JS at runtime
      - name: Cache iOS App Bundle
        id: app-cache
        uses: actions/cache@v4
        with:
          path: ios-app-cache
          key: ios-app-debug-${{ runner.os }}-${{ hashFiles('app.json', 'package-lock.json', 'ios/Podfile.lock') }}

      - name: Cache CocoaPods
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Prebuild iOS
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios

      - name: Build iOS App for Simulator
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          # Debug build - faster, JS served by Metro at runtime
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ env.SIMULATOR_UDID }}" \
            -derivedDataPath build \
            -parallelizeTargets \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            -quiet \
            build
          # Cache the built app
          mkdir -p ../ios-app-cache
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          cp -R "$APP_PATH" ../ios-app-cache/

      - name: Restore cached app
        if: steps.app-cache.outputs.cache-hit == 'true'
        run: |
          echo "Using cached iOS app bundle (native code unchanged)"
          mkdir -p ios/build/Build/Products/Debug-iphonesimulator
          cp -R ios-app-cache/*.app ios/build/Build/Products/Debug-iphonesimulator/

      - name: Start Metro bundler
        run: |
          # Start Metro to serve JS bundle for Debug build
          npx expo start --port 8081 --max-workers 2 &
          echo "METRO_PID=$!" >> $GITHUB_ENV
          # Wait for Metro to be ready
          echo "Waiting for Metro bundler..."
          for i in {1..30}; do
            if curl -s http://localhost:8081/status 2>/dev/null | grep -q "packager-status:running"; then
              echo "Metro is ready!"
              break
            fi
            sleep 1
          done

      - name: Wait for Simulator and Install App
        run: |
          xcrun simctl bootstatus "${{ env.SIMULATOR_UDID }}" -b
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          echo "Installing app from: $APP_PATH"
          xcrun simctl install "${{ env.SIMULATOR_UDID }}" "$APP_PATH"

      - name: Run Maestro Tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: |
          mkdir -p screenshots
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test .maestro/flows/screenshots.yaml --output screenshots/report.xml --format junit --debug-output screenshots/ || true

      - name: Stop Metro
        if: always()
        run: |
          if [ -n "$METRO_PID" ]; then
            kill $METRO_PID 2>/dev/null || true
          fi

      - name: Upload Screenshots as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: screenshots/
          retention-days: 30

      - name: Post Screenshots to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const screenshotsDir = 'screenshots';
            let files = [];

            try {
              files = fs.readdirSync(screenshotsDir)
                .filter(f => f.endsWith('.png'))
                .sort();
            } catch (e) {
              console.log('No screenshots directory found');
              return;
            }

            if (files.length === 0) {
              console.log('No screenshot files found');
              return;
            }

            console.log(`Found ${files.length} screenshots: ${files.join(', ')}`);

            const prNumber = context.issue.number;
            const branchName = `screenshots/pr-${prNumber}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: refData } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = refData.default_branch;
            const { data: defaultRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`,
            });
            const baseSha = defaultRef.object.sha;

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: baseSha,
              });
              console.log(`Created branch ${branchName}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Branch ${branchName} already exists`);
              } else {
                throw e;
              }
            }

            const imageUrls = [];
            for (const file of files) {
              const filePath = path.join(screenshotsDir, file);
              const content = fs.readFileSync(filePath);
              const base64Content = content.toString('base64');
              const repoPath = `pr-${prNumber}/${file}`;

              let fileSha;
              try {
                const { data: existingFile } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: repoPath,
                  ref: branchName,
                });
                fileSha = existingFile.sha;
              } catch (e) {
                // File doesn't exist yet
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: repoPath,
                message: `Add screenshot ${file} for PR #${prNumber}`,
                content: base64Content,
                branch: branchName,
                ...(fileSha && { sha: fileSha }),
              });

              const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branchName}/${repoPath}`;
              imageUrls.push({ name: file, url: rawUrl });
              console.log(`Uploaded ${file}`);
            }

            const imageMarkdown = imageUrls
              .map(({ name, url }) => `### ${name}\n![${name}](${url})`)
              .join('\n\n');

            const body = `## Screenshot Test Results

            Maestro captured **${files.length}** screenshot(s) from this PR.

            ${imageMarkdown}

            ---
            *Generated by Maestro Screenshot Tests*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Screenshot Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created new comment');
            }
