name: Maestro Screenshot Tests

on:
  pull_request:
    branches: [main]

jobs:
  screenshot-tests:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15 Pro" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}')
          fi
          echo "Booting device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          echo "SIMULATOR_UDID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Cache Xcode Derived Data
        uses: actions/cache@v4
        with:
          path: ios/build
          key: xcode-${{ runner.os }}-${{ hashFiles('src/**', 'app.json', 'package.json') }}
          restore-keys: |
            xcode-${{ runner.os }}-

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios

      - name: Build iOS App for Simulator
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ env.SIMULATOR_UDID }}" \
            -derivedDataPath build \
            build

      - name: Install App on Simulator
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          xcrun simctl install "${{ env.SIMULATOR_UDID }}" "$APP_PATH"

      - name: Create screenshots directory
        run: mkdir -p screenshots

      - name: Run Maestro Tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test .maestro/flows/screenshots.yaml --output screenshots/report.xml --format junit || true

      - name: Upload Screenshots as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: screenshots/
          retention-days: 30

      - name: Post Screenshots to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const screenshotsDir = 'screenshots';
            let files = [];

            try {
              files = fs.readdirSync(screenshotsDir)
                .filter(f => f.endsWith('.png'))
                .sort();
            } catch (e) {
              console.log('No screenshots found');
              return;
            }

            if (files.length === 0) {
              console.log('No screenshot files found');
              return;
            }

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const screenshotArtifact = artifacts.artifacts.find(a => a.name === 'maestro-screenshots');
            const artifactUrl = screenshotArtifact
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${screenshotArtifact.id}`
              : `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = `## Screenshot Test Results

            Maestro captured **${files.length}** screenshots from this PR.

            ### Screenshots captured:
            ${files.map(f => `- \`${f}\``).join('\n')}

            [Download all screenshots](${artifactUrl})

            ---
            *Generated by Maestro Screenshot Tests*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Screenshot Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
