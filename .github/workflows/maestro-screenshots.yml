name: Maestro Screenshot Tests

on:
  pull_request:
    branches: [main]

jobs:
  screenshot-tests:
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Boot iOS Simulator (background)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15 Pro" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}')
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null &
          echo "SIMULATOR_UDID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Maestro
        id: maestro-cache
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-v1

      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cache the built .app based on native-affecting files (only committed files!)
      # ios/ is gitignored, so we use app.json + package.json for native deps
      - name: Cache iOS App Bundle
        id: app-cache
        uses: actions/cache@v4
        with:
          path: ios-app-cache
          key: ios-app-v2-${{ runner.os }}-${{ hashFiles('app.json', 'package.json') }}

      - name: Cache CocoaPods
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-v2-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: pods-v2-${{ runner.os }}-

      - name: Prebuild iOS
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: bunx expo prebuild --platform ios

      - name: Build iOS App for Simulator
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ env.SIMULATOR_UDID }}" \
            -derivedDataPath build \
            -parallelizeTargets \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            -quiet \
            build
          mkdir -p ../ios-app-cache
          cp -R "$(find build -name '*.app' -type d | head -1)" ../ios-app-cache/

      - name: Restore cached app
        if: steps.app-cache.outputs.cache-hit == 'true'
        run: |
          echo "⚡ Using cached iOS app (native unchanged)"
          mkdir -p ios/build/Build/Products/Debug-iphonesimulator
          cp -R ios-app-cache/*.app ios/build/Build/Products/Debug-iphonesimulator/

      - name: Start Metro bundler
        run: |
          bunx expo start --port 8081 --max-workers 2 &
          for i in {1..20}; do
            curl -s http://localhost:8081/status 2>/dev/null | grep -q "packager-status:running" && break
            sleep 1
          done

      - name: Install App
        run: |
          xcrun simctl bootstatus "${{ env.SIMULATOR_UDID }}" -b
          xcrun simctl install "${{ env.SIMULATOR_UDID }}" "$(find ios/build -name '*.app' -type d | head -1)"

      - name: Run Maestro Tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
        run: |
          mkdir -p screenshots
          maestro test .maestro/flows/screenshots.yaml --output screenshots/report.xml --format junit --debug-output screenshots/ || true

      - name: Stop Metro
        if: always()
        run: pkill -f "expo start" || true

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: screenshots/
          retention-days: 30

      - name: Post Screenshots to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const screenshotsDir = 'screenshots';

            let files = [];
            try {
              files = fs.readdirSync(screenshotsDir).filter(f => f.endsWith('.png')).sort();
            } catch (e) { return; }

            if (files.length === 0) return;

            const prNumber = context.issue.number;
            const branchName = `screenshots/pr-${prNumber}`;
            const { owner, repo } = context.repo;

            const { data: refData } = await github.rest.repos.get({ owner, repo });
            const { data: defaultRef } = await github.rest.git.getRef({
              owner, repo, ref: `heads/${refData.default_branch}`,
            });

            try {
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branchName}`, sha: defaultRef.object.sha,
              });
            } catch (e) { if (e.status !== 422) throw e; }

            const imageUrls = [];
            for (const file of files) {
              const content = fs.readFileSync(path.join(screenshotsDir, file));
              const repoPath = `pr-${prNumber}/${file}`;

              let fileSha;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: repoPath, ref: branchName });
                fileSha = data.sha;
              } catch (e) {}

              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: repoPath,
                message: `Add screenshot ${file} for PR #${prNumber}`,
                content: content.toString('base64'),
                branch: branchName,
                ...(fileSha && { sha: fileSha }),
              });

              imageUrls.push({ name: file, url: `https://raw.githubusercontent.com/${owner}/${repo}/${branchName}/${repoPath}` });
            }

            const body = `## Screenshot Test Results\n\nMaestro captured **${files.length}** screenshot(s) from this PR.\n\n${imageUrls.map(({ name, url }) => `### ${name}\n![${name}](${url})`).join('\n\n')}\n\n---\n*Generated by Maestro Screenshot Tests*`;

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Screenshot Test Results'));

            if (botComment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: botComment.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
