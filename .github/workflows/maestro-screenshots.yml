name: Maestro Screenshot Tests

on:
  pull_request:
    branches: [main]

jobs:
  screenshot-tests:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15 Pro" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}')
          fi
          echo "Booting device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          echo "SIMULATOR_UDID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Cache Xcode Derived Data
        uses: actions/cache@v4
        with:
          path: ios/build
          key: xcode-release-${{ runner.os }}-${{ hashFiles('src/**', 'app.json', 'package.json') }}
          restore-keys: |
            xcode-release-${{ runner.os }}-

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios

      - name: Build iOS App for Simulator
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          # Use Release configuration to embed the JS bundle (no Metro server needed)
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ env.SIMULATOR_UDID }}" \
            -derivedDataPath build \
            build

      - name: Install App on Simulator
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          xcrun simctl install "${{ env.SIMULATOR_UDID }}" "$APP_PATH"

      - name: Create screenshots directory
        run: mkdir -p screenshots

      - name: Run Maestro Tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test .maestro/flows/screenshots.yaml --output screenshots/report.xml --format junit --debug-output screenshots/ || true

      - name: Upload Screenshots as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: screenshots/
          retention-days: 30

      - name: Post Screenshots to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const screenshotsDir = 'screenshots';
            let files = [];

            try {
              files = fs.readdirSync(screenshotsDir)
                .filter(f => f.endsWith('.png'))
                .sort();
            } catch (e) {
              console.log('No screenshots directory found');
              return;
            }

            if (files.length === 0) {
              console.log('No screenshot files found');
              return;
            }

            console.log(`Found ${files.length} screenshots: ${files.join(', ')}`);

            // Create a branch to store screenshots
            const prNumber = context.issue.number;
            const branchName = `screenshots/pr-${prNumber}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get the default branch's latest commit as base
            const { data: refData } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = refData.default_branch;
            const { data: defaultRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`,
            });
            const baseSha = defaultRef.object.sha;

            // Try to create the branch (or get existing)
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: baseSha,
              });
              console.log(`Created branch ${branchName}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Branch ${branchName} already exists`);
              } else {
                throw e;
              }
            }

            // Upload each screenshot to the branch
            const imageUrls = [];
            for (const file of files) {
              const filePath = path.join(screenshotsDir, file);
              const content = fs.readFileSync(filePath);
              const base64Content = content.toString('base64');
              const repoPath = `pr-${prNumber}/${file}`;

              // Check if file exists and get its SHA
              let fileSha;
              try {
                const { data: existingFile } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: repoPath,
                  ref: branchName,
                });
                fileSha = existingFile.sha;
              } catch (e) {
                // File doesn't exist yet
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: repoPath,
                message: `Add screenshot ${file} for PR #${prNumber}`,
                content: base64Content,
                branch: branchName,
                ...(fileSha && { sha: fileSha }),
              });

              const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branchName}/${repoPath}`;
              imageUrls.push({ name: file, url: rawUrl });
              console.log(`Uploaded ${file}`);
            }

            // Build the comment body with embedded images
            const imageMarkdown = imageUrls
              .map(({ name, url }) => `### ${name}\n![${name}](${url})`)
              .join('\n\n');

            const body = `## Screenshot Test Results

            Maestro captured **${files.length}** screenshot(s) from this PR.

            ${imageMarkdown}

            ---
            *Generated by Maestro Screenshot Tests*`;

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Screenshot Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created new comment');
            }
